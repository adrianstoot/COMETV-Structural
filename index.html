<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="COMETV Structural — Software profesional de diseño de estructuras metálicas. Editor 3D paramétrico con catálogo Eurocódigo.">
  <title>COMETV Structural — Diseño de Estructuras Metálicas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <!-- COMMAND PALETTE -->
  <div id="command-palette-overlay" class="hidden">
    <div id="command-palette">
      <div class="cp-search-row">
        <i class="fa-solid fa-magnifying-glass cp-icon"></i>
        <input type="text" id="cp-input" placeholder="Escribe un comando o busca acción…" autocomplete="off" spellcheck="false">
        <kbd class="cp-esc">Esc</kbd>
      </div>
      <div id="cp-results"></div>
    </div>
  </div>

  <!-- CONTEXT MENU -->
  <div id="context-menu" class="hidden">
    <div class="ctx-item" data-action="duplicate"><i class="fa-solid fa-clone"></i> Duplicar</div>
    <div class="ctx-item" data-action="isolate"><i class="fa-solid fa-eye"></i> Aislar</div>
    <div class="ctx-item" data-action="focus"><i class="fa-solid fa-crosshairs"></i> Centrar cámara</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item danger" data-action="delete"><i class="fa-solid fa-trash"></i> Eliminar</div>
  </div>

  <!-- HOVER TOOLTIP -->
  <div id="hover-tooltip" class="hidden"></div>

  <!-- MAIN APP -->
  <div id="app">
    <!-- HEADER BAR -->
    <div id="header"></div>

    <!-- SIDEBAR (left icon strip) -->
    <div id="sidebar"></div>

    <!-- RIBBON (tabbed toolbar) -->
    <div id="ribbon"></div>

    <!-- 3D VIEWPORT -->
    <div id="canvas-container">
      <!-- VIEW CUBE -->
      <div id="view-cube">
        <div class="vc-label vc-top" data-view="top">TOP</div>
        <div class="vc-label vc-front" data-view="front">FRONT</div>
        <div class="vc-label vc-right" data-view="right">RIGHT</div>
        <div class="vc-label vc-iso" data-view="iso">3D</div>
      </div>

      <!-- VIEWPORT OVERLAYS -->
      <div id="viewport-mode-badge">TECHNICAL CLAY</div>

      <!-- MINI TRANSFORM WIDGET (shown on selection) -->
      <div id="mini-transform" class="hidden">
        <button class="mt-btn active" data-mode="translate" title="Mover (G)"><i class="fa-solid fa-up-down-left-right"></i></button>
        <button class="mt-btn" data-mode="rotate" title="Rotar (R)"><i class="fa-solid fa-rotate"></i></button>
        <button class="mt-btn" data-mode="scale" title="Escalar (S)"><i class="fa-solid fa-expand"></i></button>
        <div class="mt-sep"></div>
        <button class="mt-btn" id="mt-local-global" title="Coordenadas Locales/Globales"><span class="mt-coord-label">GLB</span></button>
      </div>

      <!-- SNAP INDICATOR -->
      <div id="snap-indicator" class="hidden">
        <i class="fa-solid fa-magnet"></i>
        <span id="snap-type-label">GRID</span>
      </div>

      <!-- COORD READOUT -->
      <div id="coord-readout">
        <span><b>X</b> <span id="cr-x">0.000</span></span>
        <span><b>Y</b> <span id="cr-y">0.000</span></span>
        <span><b>Z</b> <span id="cr-z">0.000</span></span>
      </div>
    </div>

    <!-- PROPERTIES PANEL (right) -->
    <div id="properties-panel"></div>

    <!-- STATUS BAR (bottom) -->
    <div id="status-bar">
      <div class="sb-left">
        <span class="sb-logo">COMETV <b>STRUCTURAL</b></span>
        <span class="sb-sep">|</span>
        <span id="sb-objects">0 objetos</span>
        <span class="sb-sep">|</span>
        <span id="sb-selection">Sin selección</span>
      </div>
      <div class="sb-center">
        <span id="sb-tool">Seleccionar</span>
      </div>
      <div class="sb-right">
        <span id="sb-snap-status" class="sb-snap active"><i class="fa-solid fa-magnet"></i> SNAP</span>
        <span class="sb-sep">|</span>
        <span id="sb-coords">0.000 · 0.000 · 0.000</span>
        <span class="sb-sep">|</span>
        <span id="sb-version">v3.0 PRO</span>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
